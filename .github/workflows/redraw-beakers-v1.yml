name: Redraw Beakers V1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace beaker drawings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_fn = r'''function beakerSVG(cap, amount){
  const dims = cap===1000 ? {w:184,h:184} : cap===500 ? {w:166,h:164} : {w:148,h:144};
  const vw=dims.w, vh=dims.h;
  const top=24, bottom=vh-24, left=18, right=vw-36;
  const fillH=(amount/cap)*(bottom-top);
  const fillY=bottom-fillH;
  const major=cap===1000?100:cap===500?100:10;
  const minor=major/2;
  let ticks='', labels='';
  for(let m=minor;m<=cap;m+=minor){
    const y=bottom-(m/cap)*(bottom-top);
    const isMajor=m%major===0;
    const len=isMajor?22:12;
    ticks+=`<line x1="${right-len}" y1="${y}" x2="${right}" y2="${y}" stroke="${isMajor?'#173b5e':'#7890a5'}" stroke-width="${isMajor?2.5:1.3}"/>`;
    if(isMajor){
      const fz=cap===100?11:12;
      labels+=`<text x="${right+5}" y="${y+4}" font-size="${fz}" font-weight="900" fill="#173b5e">${m}</text>`;
    }
  }
  return `<svg viewBox="0 0 ${vw} ${vh}" style="width:${vw}px;height:${vh}px" aria-label="original ${cap} ml Sports Lab measuring cup">
    <defs><linearGradient id="cupFill${cap}${amount}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7bd9ec"/><stop offset="1" stop-color="#40acd1"/></linearGradient></defs>
    <path d="M24 18 H${vw-30} L${vw-38} ${bottom} Q${vw-40} ${vh-10} ${vw-58} ${vh-10} H44 Q26 ${vh-10} 24 ${bottom} Z" fill="#f8fdff" stroke="#176ca5" stroke-width="4" stroke-linejoin="round"/>
    <path d="M20 18 H${vw-26}" stroke="#176ca5" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 ${fillY} H${vw-42} L${vw-48} ${bottom-3} Q${vw-49} ${vh-16} ${vw-61} ${vh-16} H47 Q35 ${vh-16} 34 ${bottom-3} Z" fill="url(#cupFill${cap}${amount})" opacity=".9"/>
    <line x1="31" y1="${fillY}" x2="${vw-42}" y2="${fillY}" stroke="#1689bd" stroke-width="3"/>
    ${ticks}${labels}
    <rect x="34" y="30" width="${Math.max(52,vw-104)}" height="21" rx="10" fill="#176ca5"/>
    <text x="${34+Math.max(52,vw-104)/2}" y="45" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">SPORTS LAB</text>
    <text x="${vw-20}" y="${vh-7}" text-anchor="end" font-size="12" font-weight="900" fill="#0c5c92">ml</text>
  </svg>`;
}

'''
          s,n=re.subn(r'function beakerSVG\(cap, amount\)\{.*?\n\}\n\nfunction renderScene',new_fn+'function renderScene',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not replace beakerSVG')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Redraw Water Polo beakers in original Sports Lab style"
          git push
