name: Install Mobile Beaker Fit V1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="mobile-beaker-fit-v1.js?v=20260810a"></script>\n'
          if 'mobile-beaker-fit-v1.js' not in s:
              s=s.replace('</body>', tag+'</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Keep all beakers visible on portrait phones"
          git push
